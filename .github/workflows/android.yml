name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest build-tools;34.0.0 platforms;android-34'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Подпись: если в секретах есть keystore — APK подписывается ключом,
      # иначе собирается неподписанный.
      - name: Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        run: set -o pipefail; gradle --no-daemon assembleRelease 2>&1 | tee build.log

      # Логи Actions доступны только админу репозитория, поэтому при падении
      # ошибки компиляции выкладываются в ветку ci-log.
      - name: Publish log
        if: failure()
        run: |
          grep -E "^(e:|w:|FAILURE|\* What went wrong|Caused by)" build.log | head -300 > errors.txt || true
          tail -200 build.log > tail.txt
          git config user.name ci
          git config user.email ci@local
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          git add -f errors.txt tail.txt
          git commit -m "build log"
          git push -f origin ci-log

      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Podryad-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: podryad-apk
          path: out/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            «Подряд» для Android.
            Скачайте APK, откройте на телефоне, разрешите установку из этого источника.
